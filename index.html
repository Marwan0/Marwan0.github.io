@font-face { font-family: "Readex Pro"; src: url(fonts/ReadexPro-Variable.ttf) format("truetype"); font-weight: 160 700; font-display: swap; }
:root { --red: #d7261e; --yellow: #ffd100; --green: #0a7d3b; --blue: #1846a3; --black: #111111; --enamel: #fafaf7; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--enamel); color: var(--black); font: 400 18px/1.4 "Readex Pro", system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
main { width: min(100%, 460px); display: grid; gap: 14px; }

a { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; border: 4px solid var(--black); box-shadow: 6px 6px 0 var(--black);
    font: 400 28px/1 Lalezar, Impact, sans-serif; text-transform: uppercase; text-decoration: none; color: var(--enamel); transition: transform .1s, box-shadow .1s; }
a:hover, a:focus-visible { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--black); }
a:focus-visible { outline: 4px solid var(--yellow); outline-offset: 4px; }
a small { margin-left: auto; font: 500 15px/1 "Readex Pro", sans-serif; text-transform: none; opacity: .9; }
svg { width: 30px; height: 30px; flex: none; margin-top: -4px; }
.li { background: var(--blue); } .yt { background: var(--red); } .fb { background: var(--green); }
.mail { background: var(--yellow); color: var(--black); }
footer { margin-top: 18px; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { a { transition: none; } }
